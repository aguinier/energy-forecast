[pytest]
# Every test in this repo lives in tests/. Pinning testpaths makes a bare
# `python -m pytest` mean exactly `python -m pytest tests/`, so the documented
# command cannot be turned red by an ad-hoc `test_*.py` sitting somewhere else
# in a checkout — including untracked scratch files, which is how ABL-336
# happened (5 probe scripts in scripts/ plus 3 more in the gitignored
# _scratch/).
#
# The trade-off: a test added OUTSIDE tests/ is silently not run by the bare
# command. If you add a new test directory, add it here too.
testpaths = tests
